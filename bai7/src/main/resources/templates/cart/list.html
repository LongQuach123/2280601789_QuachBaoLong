<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_layout :: head(~{::title})}">
    <title>Giỏ hàng</title>
</head>
<body>
    <div th:replace="~{_layout :: navbar(${cartCount})}"></div>

    <div class="container mt-4">
        <h2 class="mb-3">Giỏ hàng</h2>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info">
            Giỏ hàng của bạn đang trống. <a th:href="@{/products}">Tiếp tục mua sắm</a>
        </div>

        <table class="table table-bordered align-middle" th:if="${!#lists.isEmpty(cartItems)}">
            <thead class="table-dark">
                <tr>
                    <th>Sản phẩm</th>
                    <th>Hình</th>
                    <th>Giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${cartItems}">
                    <td th:text="${item.productName}"></td>
                    <td><img th:src="${item.image}" alt="item" width="100" height="90"></td>
                    <td th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + ' đ'"></td>
                    <td>
                        <form th:action="@{/cart/update}" method="post" class="d-flex gap-2">
                            <input type="hidden" name="productId" th:value="${item.productId}">
                            <input type="number" name="quantity" min="1" class="form-control" style="max-width: 90px" th:value="${item.quantity}">
                            <button class="btn btn-warning btn-sm" type="submit">Cập nhật</button>
                        </form>
                    </td>
                    <td th:text="${#numbers.formatInteger(item.subtotal, 0, 'COMMA')} + ' đ'"></td>
                    <td>
                        <a class="btn btn-danger btn-sm" th:href="@{/cart/remove/{id}(id=${item.productId})}">Xóa</a>
                    </td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="4" class="text-end">Tổng cộng</th>
                    <th th:text="${#numbers.formatInteger(totalAmount, 0, 'COMMA')} + ' đ'"></th>
                    <th></th>
                </tr>
            </tfoot>
        </table>

        <div class="d-flex justify-content-between" th:if="${!#lists.isEmpty(cartItems)}">
            <a class="btn btn-secondary" th:href="@{/products}">Tiếp tục mua sắm</a>
            <a class="btn btn-success" th:href="@{/cart/checkout}">Đặt hàng</a>
        </div>
    </div>

    <div th:replace="~{_layout :: footer}"></div>
</body>
</html>
