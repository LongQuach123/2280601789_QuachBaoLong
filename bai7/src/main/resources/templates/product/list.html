<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_layout :: head(~{::title})}">
    <title>Danh sách sản phẩm</title>
</head>
<body>
    <div th:replace="~{_layout :: navbar(${cartCount})}"></div>

    <div class="container body-content mt-4">
        <h2 class="mb-3">Danh sách sản phẩm</h2>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/products}" method="get" class="row g-2 mb-3">
            <div class="col-md-3">
                <input type="text" name="keyword" class="form-control" placeholder="Tìm theo tên sản phẩm" th:value="${keyword}">
            </div>
            <div class="col-md-3">
                <select name="categoryId" class="form-select">
                    <option value="">Tất cả danh mục</option>
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${categoryId != null and categoryId == category.id}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <select name="sortField" class="form-select">
                    <option value="id" th:selected="${sortField == 'id'}">Sắp xếp theo ID</option>
                    <option value="name" th:selected="${sortField == 'name'}">Sắp xếp theo tên</option>
                    <option value="price" th:selected="${sortField == 'price'}">Sắp xếp theo giá</option>
                </select>
            </div>
            <div class="col-md-2">
                <select name="sortDir" class="form-select">
                    <option value="asc" th:selected="${sortDir == 'asc'}">Tăng dần</option>
                    <option value="desc" th:selected="${sortDir == 'desc'}">Giảm dần</option>
                </select>
            </div>
            <div class="col-md-1">
                <input type="hidden" name="size" th:value="${size}">
                <button type="submit" class="btn btn-primary w-100">Lọc</button>
            </div>
            <div class="col-md-1 text-end">
                <a th:href="@{/products/add}" class="btn btn-success w-100">Thêm</a>
            </div>
        </form>

        <table class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Tên</th>
                    <th>Hình ảnh</th>
                    <th>Giá</th>
                    <th>Danh mục</th>
                    <th width="150">Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="6" class="text-center">Không có sản phẩm phù hợp.</td>
                </tr>
                <tr th:each="product : ${products}">
                    <th scope="row" th:text="${product.id}"></th>
                    <td th:text="${product.name}"></td>
                    <td>
                        <img height="100" width="120" th:src="${product.image}" alt="Product Image">
                    </td>
                    <td th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + ' đ'"></td>
                    <td th:text="${product.category != null ? product.category.name : 'Chưa phân loại'}"></td>
                    <td>
                        <a class="btn btn-sm btn-primary" th:href="@{/cart/add/{id}(id=${product.id})}">Add to cart</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <nav th:if="${totalPages > 0}" th:with="baseUrl='/products?keyword=' + ${keyword} + '&sortField=' + ${sortField} + '&sortDir=' + ${sortDir} + '&size=' + ${size}, categoryParam=${categoryId != null ? '&categoryId=' + categoryId : ''}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="${baseUrl} + '&page=' + ${currentPage - 1} + ${categoryParam}">Previous</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="${baseUrl} + '&page=' + ${i} + ${categoryParam}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                    <a class="page-link" th:href="${baseUrl} + '&page=' + ${currentPage + 1} + ${categoryParam}">Next</a>
                </li>
            </ul>
        </nav>
    </div>

    <div th:replace="~{_layout :: footer}"></div>
</body>
</html>
