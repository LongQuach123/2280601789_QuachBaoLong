<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Luxury Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at top, #1c1c1c, #000);
    font-family:'Poppins',sans-serif;
}

.login-box{

    width:420px;
    padding:45px;

    border-radius:18px;

    background:rgba(255,255,255,0.05);

    backdrop-filter: blur(15px);

    border:1px solid rgba(255,215,0,0.3);

    box-shadow:
        0 0 40px rgba(0,0,0,0.8),
        0 0 10px rgba(255,215,0,0.15);

}

.login-title{
    text-align:center;
    font-family:'Playfair Display',serif;
    color:#FFD700;
    letter-spacing:2px;
    margin-bottom:35px;
}

.form-label{
    color:#ccc;
}

.form-control{

    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    color:white;
    border-radius:10px;

}

.form-control:focus{

    border-color:#FFD700;
    box-shadow:0 0 8px rgba(255,215,0,0.5);
    background:rgba(255,255,255,0.08);
    color:white;

}

.btn-luxury{

    width:100%;
    padding:12px;

    border-radius:30px;

    background:linear-gradient(45deg,#FFD700,#c9a227);

    border:none;

    font-weight:600;
    letter-spacing:1px;

    transition:0.3s;

}

.btn-luxury:hover{

    transform:scale(1.03);
    box-shadow:0 0 15px rgba(255,215,0,0.6);

}

.alert{

    border-radius:10px;

}

.footer-text{

    margin-top:20px;
    text-align:center;
    color:#aaa;
    font-size:13px;

}

</style>
</head>

<body>

<div class="login-box">

<h2 class="login-title">MEMBER LOGIN</h2>

<div th:if="${param.error}" class="alert alert-danger text-center">
Tài khoản hoặc mật khẩu không chính xác
</div>

<div th:if="${param.logout}" class="alert alert-success text-center">
Bạn đã đăng xuất thành công
</div>

<form th:action="@{/login}" method="post">

<div class="mb-3">
<label class="form-label">Tên đăng nhập</label>
<input type="text" name="username" class="form-control" placeholder="Enter username" required>
</div>

<div class="mb-4">
<label class="form-label">Mật khẩu</label>
<input type="password" name="password" class="form-control" placeholder="Enter password" required>
</div>

<button type="submit" class="btn btn-luxury">
Đăng nhập
</button>

</form>

<div class="footer-text">
Luxury Management System
</div>

</div>

</body>
</html>
