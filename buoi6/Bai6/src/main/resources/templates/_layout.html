<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title th:replace="${title}">Product Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<style>

body{

    font-family:'Poppins',sans-serif;

}

/* NAVBAR */

.luxury-navbar{

    background:rgba(0,0,0,0.9);

    backdrop-filter: blur(10px);

    border-bottom:1px solid rgba(255,215,0,0.3);

    padding:12px 40px;

}

.navbar-brand{

    color:#FFD700 !important;

    font-weight:500;

    margin-right:25px;

    transition:0.3s;

}

.navbar-brand:hover{

    color:white !important;

}

/* FOOTER */

.luxury-footer{

    margin-top:60px;

    padding:20px;

    text-align:center;

    color:#aaa;

    border-top:1px solid rgba(255,215,0,0.3);

    background:rgba(0,0,0,0.9);

}

</style>

</head>

<body>

<!-- NAVBAR -->

<nav th:fragment="navbar" class="navbar luxury-navbar">

<a class="navbar-brand" th:href="@{/products}">
Home
</a>

<a class="navbar-brand" th:href="@{/products/add}">
Add Product
</a>

</nav>

<!-- FOOTER -->

<div th:fragment="footer" class="luxury-footer">

<p>© 2026 Product Management System</p>

</div>

</body>
</html>
